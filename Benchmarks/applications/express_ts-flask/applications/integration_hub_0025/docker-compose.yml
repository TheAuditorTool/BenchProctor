services:
  mapping-store:
    build: ./services/mapping-store
    environment:
      - SERVICE_NAME=mapping-store
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      cache:
        condition: service_healthy
      connector-api:
        condition: service_healthy
  connector-api:
    build: ./services/connector-api
    environment:
      - SERVICE_NAME=connector-api
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      cache:
        condition: service_healthy
  cache:
    image: redis:7-alpine
    command: ["sh", "-c", "(until redis-cli SET user_data cached_value >/dev/null 2>&1; do sleep 1; done) & exec docker-entrypoint.sh redis-server"]
    ports:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GET user_data | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 12
