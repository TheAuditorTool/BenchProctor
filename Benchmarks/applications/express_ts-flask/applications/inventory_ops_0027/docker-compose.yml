services:
  supplier-feed:
    build: ./services/supplier-feed
    environment:
      - SERVICE_NAME=supplier-feed
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      allocation-service:
        condition: service_healthy
  allocation-service:
    build: ./services/allocation-service
    environment:
      - SERVICE_NAME=allocation-service
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
