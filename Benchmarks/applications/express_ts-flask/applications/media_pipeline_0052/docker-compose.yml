services:
  watermark-service:
    build: ./services/watermark-service
    environment:
      - SERVICE_NAME=watermark-service
      - DATABASE_URL=postgres://app:app@db:5432/app
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      metadata-index:
        condition: service_healthy
  metadata-index:
    build: ./services/metadata-index
    environment:
      - SERVICE_NAME=metadata-index
      - DATABASE_URL=postgres://app:app@db:5432/app
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    ports:
      - "5432"
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "app"
      POSTGRES_DB: "app"
    volumes:
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app"]
      interval: 5s
      timeout: 3s
      retries: 12
