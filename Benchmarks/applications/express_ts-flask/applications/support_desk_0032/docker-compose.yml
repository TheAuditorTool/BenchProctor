services:
  ticket-router:
    build: ./services/ticket-router
    environment:
      - SERVICE_NAME=ticket-router
      - DATABASE_URL=postgres://app:app@db:5432/app
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      knowledge-index:
        condition: service_healthy
  knowledge-index:
    build: ./services/knowledge-index
    environment:
      - SERVICE_NAME=knowledge-index
      - DATABASE_URL=postgres://app:app@db:5432/app
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
  broker:
    image: rabbitmq:3.13-management
    command: ["sh", "-c", "(until rabbitmqadmin declare queue name=app-events durable=true >/dev/null 2>&1; do sleep 2; done; rabbitmqadmin publish routing_key=app-events payload=msg-001 >/dev/null && touch /tmp/seeded) & exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "5672"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 12
  db:
    image: postgres:16-alpine
    ports:
      - "5432"
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "app"
      POSTGRES_DB: "app"
    volumes:
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app"]
      interval: 5s
      timeout: 3s
      retries: 12
