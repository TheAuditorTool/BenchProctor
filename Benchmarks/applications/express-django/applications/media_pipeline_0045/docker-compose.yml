services:
  upload-gateway:
    build: ./services/upload-gateway
    environment:
      - SERVICE_NAME=upload-gateway
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
      cache:
        condition: service_healthy
      transcode-service:
        condition: service_healthy
  transcode-service:
    build: ./services/transcode-service
    environment:
      - SERVICE_NAME=transcode-service
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
      cache:
        condition: service_healthy
  broker:
    image: rabbitmq:3.13-management
    command: ["sh", "-c", "(until rabbitmqadmin declare queue name=app-events durable=true >/dev/null 2>&1; do sleep 2; done; rabbitmqadmin publish routing_key=app-events payload=msg-001 >/dev/null && touch /tmp/seeded) & exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "5672"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 12
  cache:
    image: redis:7-alpine
    command: ["sh", "-c", "(until redis-cli SET user_data cached_value >/dev/null 2>&1; do sleep 1; done) & exec docker-entrypoint.sh redis-server"]
    ports:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GET user_data | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 12
