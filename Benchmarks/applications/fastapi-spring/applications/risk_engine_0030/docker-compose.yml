services:
  case-service:
    build: ./services/case-service
    environment:
      - SERVICE_NAME=case-service
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      alert-triage:
        condition: service_healthy
  alert-triage:
    build: ./services/alert-triage
    environment:
      - SERVICE_NAME=alert-triage
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
