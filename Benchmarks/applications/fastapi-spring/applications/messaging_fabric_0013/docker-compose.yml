services:
  message-api:
    build: ./services/message-api
    environment:
      - SERVICE_NAME=message-api
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      bounce-handler:
        condition: service_healthy
  bounce-handler:
    build: ./services/bounce-handler
    environment:
      - SERVICE_NAME=bounce-handler
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
