services:
  reservation-service:
    build: ./services/reservation-service
    environment:
      - SERVICE_NAME=reservation-service
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      catalog-api:
        condition: service_healthy
  catalog-api:
    build: ./services/catalog-api
    environment:
      - SERVICE_NAME=catalog-api
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
