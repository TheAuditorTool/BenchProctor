services:
  thumbnail-service:
    build: ./services/thumbnail-service
    environment:
      - SERVICE_NAME=thumbnail-service
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      upload-gateway:
        condition: service_healthy
  upload-gateway:
    build: ./services/upload-gateway
    environment:
      - SERVICE_NAME=upload-gateway
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
