services:
  fx-service:
    build: ./services/fx-service
    environment:
      - SERVICE_NAME=fx-service
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      payments-api:
        condition: service_healthy
  payments-api:
    build: ./services/payments-api
    environment:
      - SERVICE_NAME=payments-api
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
