services:
  revision-store:
    build: ./services/revision-store
    environment:
      - SERVICE_NAME=revision-store
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
      syndication-feed:
        condition: service_healthy
  syndication-feed:
    build: ./services/syndication-feed
    environment:
      - SERVICE_NAME=syndication-feed
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
  broker:
    image: rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
    command: ["sh", "-c", "(until rabbitmqadmin declare queue --name app-events --durable true >/dev/null 2>&1; do sleep 2; done; rabbitmqadmin publish message --routing-key app-events --payload msg-001 >/dev/null && touch /tmp/seeded) & exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "5672"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 12
