services:
  asset-library:
    build: ./services/asset-library
    environment:
      - SERVICE_NAME=asset-library
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      article-api:
        condition: service_healthy
  article-api:
    build: ./services/article-api
    environment:
      - SERVICE_NAME=article-api
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
