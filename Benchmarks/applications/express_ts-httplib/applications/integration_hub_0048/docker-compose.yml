services:
  transform-service:
    build: ./services/transform-service
    environment:
      - SERVICE_NAME=transform-service
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      partner-registry:
        condition: service_healthy
  partner-registry:
    build: ./services/partner-registry
    environment:
      - SERVICE_NAME=partner-registry
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
