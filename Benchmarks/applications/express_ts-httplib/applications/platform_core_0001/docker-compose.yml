services:
  audit-log:
    build: ./services/audit-log
    environment:
      - SERVICE_NAME=audit-log
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      platform-api:
        condition: service_healthy
  platform-api:
    build: ./services/platform-api
    environment:
      - SERVICE_NAME=platform-api
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
