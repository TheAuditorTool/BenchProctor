services:
  template-service:
    build: ./services/template-service
    environment:
      - SERVICE_NAME=template-service
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      delivery-service:
        condition: service_healthy
  delivery-service:
    build: ./services/delivery-service
    environment:
      - SERVICE_NAME=delivery-service
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
