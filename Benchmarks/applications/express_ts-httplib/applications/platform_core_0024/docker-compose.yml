services:
  registry-service:
    build: ./services/registry-service
    environment:
      - SERVICE_NAME=registry-service
      - DATABASE_URL=postgres://app:app@db:5432/app
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      quota-service:
        condition: service_healthy
  quota-service:
    build: ./services/quota-service
    environment:
      - SERVICE_NAME=quota-service
      - DATABASE_URL=postgres://app:app@db:5432/app
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
  broker:
    image: rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
    command: ["sh", "-c", "(until rabbitmqadmin declare queue --name app-events --durable true >/dev/null 2>&1; do sleep 2; done; rabbitmqadmin publish message --routing-key app-events --payload msg-001 >/dev/null && touch /tmp/seeded) & exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "5672"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 12
  db:
    image: postgres:18.6-alpine3.23@sha256:dec395d8c09c45609d6deb5c2388a07882d64fa59b1d98c1895792e085f57888
    ports:
      - "5432"
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "app"
      POSTGRES_DB: "app"
    volumes:
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app"]
      interval: 5s
      timeout: 3s
      retries: 12
