[package]
name = "app-services"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "=0.9.3"
aes-gcm = "=0.11.1"
ammonia = "=4.2.5"
aws-config = { version = "=1.13.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-iam = { version = "=1.131.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "=1.117.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "=1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "=0.8.9", features = ["query", "multipart"] }
base64 = "=0.23.1"
blowfish = "=0.10.0"
cbc = { version = "=0.2.1", features = ["alloc"] }
cookie = "=0.18.2"
csv = "=1.4.0"
des = "=0.9.0"
diesel = { version = "=2.3.14", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
fastrand = "=2.5.0"
futures-util = "=0.3.34"
hex = "=0.4.3"
hmac = "=0.13.0"
html-escape = "=0.3.0"
lapin = "=4.12.3"
ldap3 = { version = "=0.12.1", default-features = false, features = ["sync"] }
libc = "=0.2.191"
md-5 = "=0.11.0"
minijinja = "=3.0.2"
mongodb = { version = "=3.9.1" }
pulldown-cmark = "=0.13.6"
rand = "=0.10.3"
redis = "=1.7.1"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", features = ["json", "query"] }
rocket = { version = "=0.5.1", features = ["json"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde_json = "=1.0.154"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
shell-escape = "=0.1.5"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "postgres"] }
sxd-document = "=0.3.2"
sxd-xpath = "=0.4.2"
tokio = { version = "=1.54.1", features = ["full"] }
url = "=2.5.8"
urlencoding = "=2.1.3"
validator = { version = "=0.21.0", features = ["derive"] }

[lib]
path = "lib.rs"
