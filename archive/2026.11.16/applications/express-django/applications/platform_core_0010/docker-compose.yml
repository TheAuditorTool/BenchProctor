services:
  job-service:
    build: ./services/job-service
    environment:
      - SERVICE_NAME=job-service
      - DATABASE_URL=postgres://app:app@db:5432/app
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      feature-flags:
        condition: service_healthy
  feature-flags:
    build: ./services/feature-flags
    environment:
      - SERVICE_NAME=feature-flags
      - DATABASE_URL=postgres://app:app@db:5432/app
      - APP_SECRET_KEY=placeholder-not-a-real-secret-00
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
  cache:
    image: redis:7-alpine
    command: ["sh", "-c", "(until redis-cli SET user_data cached_value >/dev/null 2>&1; do sleep 1; done) & exec docker-entrypoint.sh redis-server"]
    ports:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GET user_data | grep -q ."]
      interval: 5s
      timeout: 3s
      retries: 12
  db:
    image: postgres:16-alpine
    ports:
      - "5432"
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "app"
      POSTGRES_DB: "app"
    volumes:
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app"]
      interval: 5s
      timeout: 3s
      retries: 12
