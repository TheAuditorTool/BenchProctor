services:
  dispute-service:
    build: ./services/dispute-service
    environment:
      - SERVICE_NAME=dispute-service
      - SESSION_SECRET=placeholder-not-a-real-secret-00
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      capture-service:
        condition: service_healthy
  capture-service:
    build: ./services/capture-service
    environment:
      - SERVICE_NAME=capture-service
    ports:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
